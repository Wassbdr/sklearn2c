[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sklearn2c"
version = "0.2.0"
description = "Transpile fitted scikit-learn models to dependency-free C99 for microcontrollers, with compiled-C parity checks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wassim Badraoui" }]
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.3", "numpy>=1.22", "joblib>=1.2"]
keywords = ["scikit-learn", "embedded", "microcontroller", "tinyml", "codegen", "c"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
test = ["pytest>=7"]
showcase = ["matplotlib>=3.7"]

[project.scripts]
sklearn2c = "sklearn2c.cli:main"

[project.urls]
Repository = "https://github.com/Wassbdr/sklearn2c"

[tool.setuptools]
packages = ["sklearn2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
